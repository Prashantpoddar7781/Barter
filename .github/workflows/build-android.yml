name: Build Android Binaries (AAB & APK)

on:
  push:
    branches:
      - implement-marketplace-backend-features
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_API_URL: "https://barter-production-d106.up.railway.app"
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Binaries
        run: |
          cd android
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload Release AAB (Play Store Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: barterhub-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload Debug APK (Direct Install & Test)
        uses: actions/upload-artifact@v4
        with:
          name: barterhub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
